name: scifact-dev-rerankers
mlflow_experiment: retrieval-baselines
dataset: scifact
split: dev
configs:
- name: hybrid_rrf
  mode: hybrid_rrf
  embedder: BAAI/bge-small-en-v1.5
- name: rerank_minilm_d20
  mode: hybrid_rrf_rerank
  embedder: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L6-v2
  rerank_depth: 20
- name: rerank_minilm_d50
  mode: hybrid_rrf_rerank
  embedder: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L6-v2
  rerank_depth: 50
- name: rerank_minilm_d100
  mode: hybrid_rrf_rerank
  embedder: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L6-v2
  rerank_depth: 100
- name: rerank_bge_base_d50
  mode: hybrid_rrf_rerank
  embedder: BAAI/bge-small-en-v1.5
  reranker: BAAI/bge-reranker-base
  rerank_depth: 50
- name: rerank_gte_modernbert_d50
  mode: hybrid_rrf_rerank
  embedder: BAAI/bge-small-en-v1.5
  reranker: Alibaba-NLP/gte-reranker-modernbert-base
  rerank_depth: 50
comparisons:
- baseline: hybrid_rrf
  candidate: rerank_minilm_d20
- baseline: hybrid_rrf
  candidate: rerank_minilm_d50
- baseline: hybrid_rrf
  candidate: rerank_minilm_d100
- baseline: hybrid_rrf
  candidate: rerank_bge_base_d50
- baseline: hybrid_rrf
  candidate: rerank_gte_modernbert_d50
extra:
  rerank_batch_size: 16
