name: CI

on:
  push:
    branches: [main, phase-2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mezvuat
          POSTGRES_USER: mezvuat
          POSTGRES_PASSWORD: mezvuat-dev-only
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U mezvuat -d mezvuat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 16333:6333
    env:
      HF_HOME: ${{ github.workspace }}/.cache/hf
      ML_DEVICE: cpu
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --group ml --group eval --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync lint-imports
      - run: uv run --no-sync python ../scripts/check_licenses.py
      - name: frontend/openapi.json matches the API
        run: uv run --no-sync python ../scripts/export_openapi.py --check
      - uses: actions/cache@v4
        with:
          path: .cache/hf
          key: hf-${{ hashFiles('backend/src/mezvuat/ml/registry.py') }}
      - run: uv run --no-sync pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match frontend/openapi.json
        run: npm run gen:api && git diff --exit-code -- src/lib/api-types.ts
      - run: npm run licenses
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for Playwright (headless shell only)
        run: npx playwright install --with-deps --only-shell chromium
      - name: Playwright smoke test (API mocked at the network layer)
        run: npm run test:e2e
        env:
          PW_SERVER: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t mezvuat-backend:ci .
      - run: docker build -f frontend/Dockerfile -t mezvuat-frontend:ci frontend
      - name: Evaluation dependencies stay out of the API image
        run: |
          docker run --rm mezvuat-backend:ci python -c "
          import importlib.util as u, sys
          for name in ('ragas', 'mlflow'):
              if u.find_spec(name):
                  sys.exit(f'{name} must not be in the API image')
          "
