[project]
name = "mezvuat"
version = "0.1.0"
description = "Research intelligence: connected knowledge, verifiable answers."
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "bm25s>=0.3.16",
    "defusedxml>=0.7",
    "fastapi>=0.162",
    "httpx>=0.28",
    "numpy>=2.3",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.8",
    # Below 2.0 on purpose: 2.x adds onnxruntime and empty pymupdf4llm/pymupdf-layout placeholder packages with no
    # licence metadata, for layout code we do not use. See ADR-0003.
    "pymupdf>=1.28.2,<2",
    "pypdf>=7.0",
    "PyStemmer>=2.2",
    "python-multipart>=0.0.20",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.20",
    "sqlalchemy>=2.1",
    "trafilatura>=2.3",
    "uvicorn>=0.34",
]

[dependency-groups]
ml = [
    "sentence-transformers>=6.2",
    "torch>=2.15",
]
eval = [
    "mlflow>=3.18",
]
dev = [
    "import-linter>=2.3",
    "mypy>=2.4",
    "pytest>=9.0",
    "ranx>=0.3.20",
    "respx>=0.22",
    "ruff>=0.17",
    "types-pyyaml>=6.0",
]

[project.scripts]
mezvuat-worker = "mezvuat.worker.main:main"
mezvuat-exp = "mezvuat.evaluation.cli:main"
mezvuat-corpus = "mezvuat.ingestion.corpus.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mezvuat"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["mezvuat"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mezvuat.core.*", "mezvuat.retrieval.*", "mezvuat.ml.*", "mezvuat.ingestion.*", "mezvuat.persistence.*"]
strict = true

[[tool.mypy.overrides]]
module = ["bm25s.*", "Stemmer.*", "pdfplumber.*", "pymupdf.*", "fitz.*", "trafilatura.*", "ranx.*", "sentence_transformers.*", "mlflow.*", "pypdf.*", "defusedxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mezvuat.ingestion.parsers.pdf"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the compose Postgres and Qdrant (skipped when unreachable)",
    "live_model: downloads or runs a real Hugging Face model",
]

[tool.importlinter]
root_package = "mezvuat"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core depends on nothing else in mezvuat"
type = "forbidden"
source_modules = ["mezvuat.core"]
forbidden_modules = [
    "mezvuat.api", "mezvuat.ingestion", "mezvuat.retrieval", "mezvuat.ml", "mezvuat.persistence",
    "mezvuat.evaluation", "mezvuat.worker", "mezvuat.workspaces",
]

[[tool.importlinter.contracts]]
name = "request path never imports evaluation or training"
type = "forbidden"
source_modules = ["mezvuat.api", "mezvuat.retrieval", "mezvuat.ingestion", "mezvuat.workspaces", "mezvuat.worker"]
forbidden_modules = ["mezvuat.evaluation", "mezvuat.ml.training"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "database and vector drivers stay in persistence"
type = "forbidden"
source_modules = ["mezvuat.api", "mezvuat.retrieval", "mezvuat.ingestion", "mezvuat.ml"]
forbidden_modules = ["qdrant_client", "alembic"]
allow_indirect_imports = true
