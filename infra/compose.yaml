# Mezvuat local stack. Run from the repo root: docker compose -f infra/compose.yaml up -d --build
# Ports are bound to 127.0.0.1 and chosen not to clash with other local projects.
name: mezvuat

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: mezvuat-backend:dev
  environment: &backend-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: mezvuat
    POSTGRES_USER: mezvuat
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mezvuat-dev-only}
    QDRANT_URL: http://qdrant:6333
    ML_DEVICE: cpu
    MEZVUAT_API_KEY: ${MEZVUAT_API_KEY:-}
  volumes:
    - app_data:/data
    - hf_cache:/cache/hf

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mezvuat
      POSTGRES_USER: mezvuat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mezvuat-dev-only}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mezvuat -d mezvuat"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  api:
    <<: *backend
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1200m

  worker:
    <<: *backend
    command: ["python", "-m", "mezvuat.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    mem_limit: 1200m

  # Optional: experiment tracking. Experiments normally log to a local file store instead.
  mlflow:
    profiles: ["ml"]
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--artifacts-destination", "/mlflow/artifacts"]
    ports:
      - "127.0.0.1:15000:5000"
    volumes:
      - mlflow_data:/mlflow
    mem_limit: 512m

volumes:
  postgres_data:
  qdrant_data:
  app_data:
  hf_cache:
  mlflow_data:
