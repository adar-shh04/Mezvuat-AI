name: scifact-test-four-configs
mlflow_experiment: retrieval-final
dataset: scifact
split: test
configs:
- name: bm25
  mode: bm25
- name: dense
  mode: dense
  embedder: BAAI/bge-small-en-v1.5
- name: hybrid_rrf
  mode: hybrid_rrf
  embedder: BAAI/bge-small-en-v1.5
- name: hybrid_rrf_rerank
  mode: hybrid_rrf_rerank
  embedder: BAAI/bge-small-en-v1.5
  reranker: BAAI/bge-reranker-base
  rerank_depth: 50
comparisons:
- baseline: bm25
  candidate: hybrid_rrf
- baseline: dense
  candidate: hybrid_rrf
- baseline: hybrid_rrf
  candidate: hybrid_rrf_rerank
extra:
  rerank_batch_size: 16
